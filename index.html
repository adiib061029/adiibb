g:13px 23px;font-size:19px;margin:7px;transition:transform .2s,filter .2s}.gold:hover{transform:translateY(-3px) scale(1.035);filter:brightness(1.08)}.gold:active{transform:translateY(3px)}.muted{background:#284b77;color:#fff;border-color:#a8c4e7;box-shadow:0 6px #122e54}.heroimg{max-width:200px;max-height:200px;object-fit:contain;filter:drop-shadow(0 12px 12px #0007);animation:float 5s infinite}.row{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap}.book{max-width:350px;width:100%;border-radius:16px;box-shadow:0 10px 25px #0006}.missiongrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:20px auto;max-width:760px}.mission{border:3px solid #f8d67c;border-radius:20px;background:#0a376cdb;padding:20px;color:white;min-height:120px;text-align:left;transition:.2s}.mission:not(:disabled):hover{transform:scale(1.03);background:#15599a}.mission:disabled{opacity:.52;cursor:not-allowed}.mission strong{display:block;font-size:23px;color:#ffeb9b;margin-bottom:8px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;margin:18px auto;max-width:940px}.card{border:4px solid #eec675;border-radius:22px;min-height:225px;padding:12px;background:linear-gradient(145deg,#f9ebc8,#d9a45c);color:#4d2b14;box-shadow:0 8px 0 #81522b,0 16px 24px #0008;transition:transform .2s,box-shadow .2s;display:flex;flex-direction:column;align-items:center;justify-content:space-around}.card:hover:not(:disabled){transform:translateY(-8px);box-shadow:0 16px 0 #81522b,0 20px 32px #0009}.card img{height:125px;max-width:100%;object-fit:contain;filter:drop-shadow(0 5px 7px #0004);border-radius:12px}.card .letter{font-weight:900;font-size:22px;background:#684019;color:#ffe79b;border-radius:50%;width:37px;height:37px;display:grid;place-items:center}.card .caption{font-size:clamp(15px,1.8vw,19px);font-weight:900}.card.correct{border-color:#45fba0;background:#b6f7b6;animation:pulse .6s}.card.wrong{border-color:#ff6363;background:#ffc7b6;animation:shake .35s}@keyframes shake{25%,75%{transform:translateX(-8px)}50%{transform:translateX(8px)}}@keyframes pulse{50%{transform:scale(1.045)}}.qbox{background:#06204ad9;border:2px solid #b9ddff;border-radius:17px;padding:13px;margin:12px 0;font-weight:900;font-size:clamp(20px,2.5vw,27px)}.feedback{min-height:56px;font-size:20px;font-weight:bold;color:#ffe38c}.progress{height:15px;background:#153c67;border-radius:20px;border:1px solid #ffe19b;overflow:hidden;margin:8px auto;max-width:650px}.progress div{height:100%;background:linear-gradient(90deg,#4af3ca,#ffda58);transition:width .4s}.lesson{background:#052553d9;padding:18px;border-radius:17px;text-align:left;margin:14px auto;max-width:790px}.lesson li{margin:10px 0;font-size:20px}.sorts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:15px auto;max-width:740px}.sorts button{border:2px solid #f7d57a;border-radius:14px;background:#fff0c6;color:#3b280e;font-weight:bold;padding:15px 7px;min-height:64px}.sorts button:disabled{opacity:.4}.steps{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px}.step{padding:8px 11px;background:#2caa8b;border-radius:12px;font-weight:bold}.badge{font-size:45px}.small{font-size:15px;opacity:.93}.notice{font-size:17px;color:#fff0a4}.footer{position:fixed;bottom:8px;right:12px;color:#fff;background:#09234b9c;border-radius:12px;padding:5px 9px;font-size:12px}@media(max-width:660px){#scene{padding-top:105px}.panel{padding:16px}.cards{gap:7px}.card{padding:6px;min-height:165px}.card img{height:76px}.card .caption{font-size:13px}.card .letter{width:28px;height:28px;font-size:17px}.missiongrid{grid-template-columns:1fr}.sorts{grid-template-columns:repeat(2,1fr)}.top{padding:6px}.top .pill{padding:5px 8px}}

</style></head><body><header class="top"><div class="brand">🏰 MISI PENGEMBARAAN WUDUK</div><span class="pill" id="score">⭐ 0 mata</span><span class="pill" id="gems">💎 0/4</span><button onclick="go('map')">🗺️ Peta</button><button onclick="toggleAudio()" id="audio">🔊 Audio</button><button onclick="go('home')">🏠 Utama</button></header><main id="scene"><span class="spark">✦</span><span class="spark">✧</span><span class="spark">✦</span><div id="app"></div></main><div class="footer">Pendidikan Islam Tahun 1 • Wuduk</div><script>
const A='assets/';const app=document.getElementById('app'),scene=document.getElementById('scene');let page='home',mission=0,q=0,score=0,done=[false,false,false,false],audio=true,answered=false,correctCount=0,chosen=[],classCount=0;
const titles=['Taman Cendawan Ajaib','Gurun Oasis Emas','Lembah Kristal Salji','Istana Pelangi'];const gems=['💚','💙','💜','💛'];
const questions=[
[{q:'Apakah maksud wuduk?',a:[['Membasuh pakaian','shower'],['Membasuh anggota tertentu dengan niat','wudu'],['Mandi seluruh badan','shower']],ok:1,why:'Wuduk ialah membasuh atau menyapu anggota tertentu dengan niat mengikut ketetapan syarak.'},{q:'Apakah hukum berwuduk sebelum solat bagi orang yang berhadas kecil?',a:[['Wajib','badge'],['Sunat','crystal'],['Harus','chest']],ok:0,why:'Wuduk wajib dilakukan untuk mengangkat hadas kecil sebelum solat.'},{q:'Air manakah boleh digunakan untuk berwuduk?',a:[['Air sirap','syrup'],['Air kopi','coffee'],['Air mutlak','water']],ok:2,why:'Air mutlak ialah air suci lagi menyucikan.'},{q:'Mengapakah kita berwuduk sebelum solat ketika berhadas kecil?',a:[['Supaya pakaian cantik','boy'],['Untuk mengangkat hadas kecil','wudu'],['Supaya badan wangi','shower']],ok:1,why:'Wuduk mengangkat hadas kecil supaya kita boleh menunaikan solat.'}],
[{q:'Apakah rukun wuduk yang pertama?',a:[['Niat','wudu'],['Membasuh kaki','boy'],['Menyapu kepala','boy']],ok:0,why:'Rukun pertama ialah niat ketika membasuh muka.'},{q:'Selepas membasuh muka, apakah rukun berikutnya?',a:[['Membasuh kaki','boy'],['Membasuh tangan hingga siku','wudu'],['Berkumur-kumur','water']],ok:1,why:'Selepas membasuh muka, basuh kedua-dua tangan hingga siku.'},{q:'Selepas membasuh tangan hingga siku, apakah rukun berikutnya?',a:[['Menyapu sebahagian kepala','wudu'],['Membasuh telinga','boy'],['Menyapu leher','boy']],ok:0,why:'Rukun keempat ialah menyapu sebahagian kepala.'},{q:'Apakah rukun wuduk yang keenam?',a:[['Membasuh muka','wudu'],['Membasuh kaki','boy'],['Tertib','badge']],ok:2,why:'Tertib bermaksud melakukan semua rukun mengikut susunan.'}],
[{q:'Antara berikut, yang manakah sunat wuduk?',a:[['Berkumur-kumur','water'],['Makan nasi','boy'],['Tidur','boy']],ok:0,why:'Berkumur-kumur ialah salah satu sunat wuduk.'},{q:'Apakah hukum membasuh kedua-dua telinga ketika wuduk?',a:[['Haram','chest'],['Sunat','crystal'],['Makruh','badge']],ok:1,why:'Menyapu kedua-dua telinga ialah amalan sunat ketika berwuduk.'},{q:'Apakah yang membatalkan wuduk?',a:[['Membaca buku','boy'],['Berjalan','boy'],['Keluar angin dari dubur','badge']],ok:2,why:'Keluar sesuatu dari qubul atau dubur membatalkan wuduk.'},{q:'Tidur yang manakah membatalkan wuduk?',a:[['Tidur duduk dengan punggung tetap','boy'],['Tidur berbaring','boy'],['Mengantuk sahaja','boy']],ok:1,why:'Tidur berbaring membatalkan wuduk; tidur duduk dengan punggung tetap mempunyai pengecualian.'}],
[{q:'Berapakah bilangan rukun wuduk?',a:[['Empat','chest'],['Lima','crystal'],['Enam','badge']],ok:2,why:'Terdapat enam rukun wuduk.'},{q:'Pilih susunan rukun yang betul.',a:[['Niat → muka → tangan hingga siku','wudu'],['Kaki → niat → muka','boy'],['Kepala → kaki → niat','boy']],ok:0,why:'Mulakan dengan niat, membasuh muka dan kemudian tangan hingga siku.'},{q:'Antara berikut, yang manakah sunat wuduk?',a:[['Membasuh muka','wudu'],['Membaca basmalah','badge'],['Niat','boy']],ok:1,why:'Membaca basmalah ialah sunat wuduk; niat dan membasuh muka ialah rukun.'},{q:'Jika wuduk terbatal sebelum solat, apakah yang perlu dibuat?',a:[['Terus solat','boy'],['Basuh tangan sahaja','water'],['Berwuduk semula','wudu']],ok:2,why:'Kita perlu mengambil wuduk semula sebelum solat.'}]];
function asset(x){return A+x+'.webp'}function setbg(x){scene.style.backgroundImage=`url("${asset(x)}")`;scene.style.backgroundColor='#8dd8f6'}function box(s){app.innerHTML=`<section class="panel">${s}</section>`}function btn(label,fn,muted=false){return `<button class="gold ${muted?'muted':''}" onclick="${fn}">${label}</button>`}function update(){document.getElementById('score').textContent='⭐ '+score+' mata';document.getElementById('gems').textContent='💎 '+done.filter(Boolean).length+'/4'}function speak(t){if(!audio||!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t.replace(/[→]/g,', '));u.lang='ms-MY';u.rate=.87;speechSynthesis.speak(u)}function toggleAudio(){audio=!audio;document.getElementById('audio').textContent=audio?'🔊 Audio':'🔇 Senyap';if(!audio&&'speechSynthesis'in window)speechSynthesis.cancel()}function go(p){page=p;update();if('speechSynthesis'in window)speechSynthesis.cancel();render()}
function render(){if(page==='home'){setbg('home');box(`<h1>🏰 Misi Pengembaraan Wuduk</h1><h2>Rahsia Pulau Ajaib</h2><p>Jelajah empat dunia ajaib, jawab soalan bergambar dan kumpul empat kristal untuk menjadi <b>Juara Wuduk!</b></p><img class="heroimg" src="${asset('crystal')}" alt="Kristal ajaib"><br>${btn('✨ MULA PENGEMBARAAN',"go('guide')")}<p class="small">Sesuai untuk murid Pendidikan Islam Tahun 1 • Umur 7 tahun</p>`)}
else if(page==='guide'){setbg('guide');box(`<h2>👋 Selamat Datang, Pengembara!</h2><div class="row"><img class="heroimg" src="${asset('boy')}" alt="Watak pemandu"><div style="max-width:530px"><p>Assalamualaikum! Saya sahabat pengembaraan kamu. Kita akan belajar cara berwuduk dengan betul sambil menjelajah pulau ajaib.</p><p>Setiap misi mempunyai <b>4 soalan</b>. Pilih satu daripada tiga gambar jawapan!</p></div></div>${btn('📖 Lihat Panduan',"go('how')")}`);speak('Assalamualaikum! Selamat datang ke misi pengembaraan wuduk!')}
else if(page==='how'){setbg('how');box(`<h2>📖 Buku Panduan Ajaib</h2><div class="lesson"><ol><li>Jelajah empat dunia secara berurutan.</li><li>Baca atau dengar soalan dan lihat pilihan jawapan bergambar.</li><li>Pilih A, B atau C. Jawapan betul memberikan <b>25 mata</b>.</li><li>Jawab sekurang-kurangnya <b>3 daripada 4 soalan</b> dengan betul untuk membuka misi berikutnya.</li><li>Selesaikan cabaran menyusun rukun dan mengelaskan sunat serta pembatal wuduk.</li><li>Kumpulkan empat kristal untuk membuka peti harta karun!</li></ol></div>${btn('🗺️ LIHAT PETA',"go('map')")}`)}
else if(page==='map'){setbg('map');box(`<h2>🗺️ Peta Empat Dunia Ajaib</h2><p>Pilih dunia yang telah dibuka. Lengkapkan misi untuk mengumpul kristal!</p><div class="missiongrid">${titles.map((t,i)=>`<button class="mission" ${i>0&&!done[i-1]?'disabled':''} onclick="start(${i})"><strong>${['🍄','🏜️','❄️','🏰'][i]} Misi ${i+1}: ${t}</strong>${done[i]?'✅ Selesai • '+gems[i]+' Kristal dikumpul':i>0&&!done[i-1]?'🔒 Masih berkunci':'🔓 Tekan untuk masuk'}</button>`).join('')}</div>${done.every(Boolean)?btn('🏆 BUKA PETI HARTA',"go('results')") : ''}`)}
else if(page==='lesson'){setbg('learn'+(mission+1));let lesson=[`<p><b>Wuduk</b> ialah membasuh atau menyapu anggota tertentu dengan niat mengikut ketetapan syarak. Wuduk mengangkat hadas kecil.</p><p>Gunakan <b>air mutlak</b> seperti air paip bersih, air hujan atau air sungai yang memenuhi syarat.</p>`,`<ol><li>Niat ketika membasuh muka</li><li>Membasuh muka</li><li>Membasuh kedua-dua tangan hingga siku</li><li>Menyapu sebahagian kepala</li><li>Membasuh kedua-dua kaki hingga buku lali</li><li>Tertib</li></ol>`,`<p><b>Contoh sunat:</b> membaca basmalah, berkumur-kumur, membasuh kedua-dua telinga.</p><p><b>Contoh pembatal:</b> keluar sesuatu dari qubul atau dubur, tidur berbaring, hilang akal.</p>`,`<p>Kamu sudah sampai di istana terakhir! Ingat semula enam rukun wuduk, contoh sunat dan perkara yang membatalkannya.</p><p>Jawab empat soalan terakhir untuk mendapatkan kristal emas!</p>`][mission];box(`<h2>${['🍄','🏜️','❄️','🏰'][mission]} Misi ${mission+1}: ${titles[mission]}</h2><div class="lesson">${lesson}</div><div class="row"><img class="heroimg" style="max-height:145px" src="${asset(mission===0?'wudu':mission===1?'water':mission===2?'crystal':'badge')}"></div>${btn('🎯 MULAKAN 4 SOALAN',"beginQuiz()")}${btn('⬅️ Peta',"go('map')",true)}`)}
else if(page==='quiz')renderQuiz();else if(page==='sequence')renderSequence();else if(page==='classify')renderClassify();else if(page==='missionEnd')renderMissionEnd();else if(page==='results'){setbg('results');box(`<h2>🎁 Bilik Harta Karun</h2><img class="heroimg" src="${asset('chest')}" alt="Peti harta"><p>Syabas! Kamu telah mengumpulkan semua kristal ajaib.</p><h2>${gems.join(' ')} &nbsp; ⭐ ${score} mata</h2>${btn('🔓 BUKA PETI AJAIB',"go('champion')")}`)}else if(page==='champion'){setbg('champion');box(`<h1>🏆 JUARA WUDUK!</h1><img class="heroimg" src="${asset('badge')}" alt="Lencana juara"><p>TAHNIAH! Kamu berjaya menamatkan empat misi dan mempelajari rukun, sunat serta pembatal wuduk!</p><h2>⭐ ${score} mata • 💎 4 kristal</h2>${btn('🌈 TERUSKAN',"go('end')")}`);confetti()}else if(page==='end'){setbg('end');box(`<h2>🌅 Pengembaraan Tamat!</h2><p>Apakah yang kamu pelajari hari ini?</p><div class="lesson"><p>💧 Wuduk menggunakan air mutlak.</p><p>👐 Wuduk mempunyai enam rukun yang mesti dilakukan secara tertib.</p><p>✨ Terdapat amalan sunat dan perkara yang membatalkan wuduk.</p></div><p>Teruskan mengamalkan wuduk dengan betul!</p>${btn('🔁 MAIN SEMULA',"restart()")}${btn('🗺️ LIHAT PETA',"go('map')",true)}`)}}
function start(i){mission=i;go('lesson')}function beginQuiz(){q=0;correctCount=0;answered=false;go('quiz')}
function renderQuiz(){setbg('quiz'+(mission+1));let item=questions[mission][q];box(`<h2>${['🍄','🏜️','❄️','🏰'][mission]} Cabaran Misi ${mission+1}</h2><div class="small">Soalan ${q+1} daripada 4 • Betul: ${correctCount}</div><div class="progress"><div style="width:${(q+1)*25}%"></div></div><div class="qbox">${item.q}</div><div class="cards">${item.a.map((a,i)=>`<button class="card" id="c${i}" onclick="answer(${i})"><span class="letter">${'ABC'[i]}</span><img src="${asset(a[1])}" alt="Ilustrasi 3D: ${a[0]}"><span class="caption">${a[0]}</span></button>`).join('')}</div><div class="feedback" id="feedback">👆 Sentuh gambar jawapan pilihan kamu.</div><div id="next"></div>${btn('🔊 DENGAR SOALAN',"speak(questions[mission][q].q)",true)}`);speak(item.q)}
function answer(i){if(answered)return;answered=true;let item=questions[mission][q],ok=i===item.ok;document.querySelectorAll('.card').forEach(b=>b.disabled=true);document.getElementById('c'+i).classList.add(ok?'correct':'wrong');if(!ok)document.getElementById('c'+item.ok).classList.add('correct');if(ok){correctCount++;score+=25;update()}document.getElementById('feedback').textContent=(ok?'🌟 Betul! Hebat! ':'💡 Cuba ingat: ')+item.why;document.getElementById('next').innerHTML=btn(q<3?'➡️ SOALAN SETERUSNYA':'🏁 TAMATKAN CABARAN',"nextQuestion()");speak((ok?'Tahniah, betul! ':'Jawapan yang betul ditunjukkan. ')+item.why)}function nextQuestion(){if(q<3){q++;answered=false;renderQuiz()}else if(mission===1){chosen=[];go('sequence')}else if(mission===2){classCount=0;go('classify')}else go('missionEnd')}
const rukun=['Niat','Basuh muka','Basuh tangan hingga siku','Sapu sebahagian kepala','Basuh kaki hingga buku lali','Tertib'];let shuffled=[2,4,0,5,1,3];function renderSequence(){setbg('quiz2');box(`<h2>🧩 Cabaran Susun 6 Rukun Wuduk</h2><p>Tekan rukun mengikut susunan yang betul, bermula dengan <b>niat</b>.</p><div class="steps">${chosen.map(i=>`<span class="step">${chosen.indexOf(i)+1}. ${rukun[i]}</span>`).join('')}</div><div class="sorts">${shuffled.map(i=>`<button ${chosen.includes(i)?'disabled':''} onclick="pickRukun(${i})">${rukun[i]}</button>`).join('')}</div><p class="notice" id="seqMsg">${chosen.length}/6 rukun disusun</p>${btn('🔄 MULA SEMULA',"chosen=[];renderSequence()",true)}`)}function pickRukun(i){if(i!==chosen.length){document.getElementById('seqMsg').textContent='💡 Belum tepat. Cuba pilih rukun seterusnya mengikut tertib.';speak('Cuba lagi, pilih rukun yang betul.');return}chosen.push(i);if(chosen.length===6){score+=50;update();go('missionEnd')}else renderSequence()}
const classify=[['Berkumur-kumur','sunat'],['Membaca basmalah','sunat'],['Menyapu kedua-dua telinga','sunat'],['Keluar angin','batal'],['Tidur berbaring','batal']];function renderClassify(){setbg('quiz3');let x=classify[classCount];box(`<h2>🚪 Dua Pintu Ajaib</h2><p>Adakah perbuatan berikut <b>sunat wuduk</b> atau <b>membatalkan wuduk</b>?</p><div class="qbox">${x[0]}</div><p>${classCount+1} daripada 5 kad</p><div class="row">${btn('✨ PINTU SUNAT',"pickClass('sunat')")}${btn('🚫 PINTU PEMBATAL',"pickClass('batal')")}</div><p class="notice" id="classMsg">Pilih pintu yang betul!</p>`)}function pickClass(v){if(v!==classify[classCount][1]){document.getElementById('classMsg').textContent='💡 Belum tepat. Cuba pilih pintu yang satu lagi.';return}classCount++;if(classCount===5){score+=50;update();go('missionEnd')}else renderClassify()}
function renderMissionEnd(){setbg(mission===3?'results':'map');let passed=correctCount>=3;if(passed)done[mission]=true;update();box(`<h2>${passed?'🌟 MISI BERJAYA!':'💪 CUBA LAGI!'}</h2><div class="badge">${passed?gems[mission]:'💫'}</div><h2>${correctCount}/4 jawapan betul</h2><p>${passed?'Tahniah! Kamu mendapat kristal ajaib dan membuka laluan pengembaraan seterusnya.':'Jawab sekurang-kurangnya 3 daripada 4 soalan dengan betul untuk membuka misi seterusnya.'}</p>${passed?btn(mission===3?'🎁 KE BILIK HARTA':'🗺️ KEMBALI KE PETA',mission===3?"go('results')":"go('map')"):btn('🔁 CUBA SEMULA',"beginQuiz()")}${btn('🏠 PETA',"go('map')",true)}`)}function confetti(){for(let i=0;i<25;i++){let e=document.createElement('span');e.textContent=['✨','⭐','💛','🎉'][i%4];e.style.cssText=`position:fixed;left:${Math.random()*95}%;top:-30px;font-size:24px;pointer-events:none;z-index:15;animation:fall ${2+Math.random()*3}s linear forwards`;document.body.appendChild(e);setTimeout(()=>e.remove(),5300)}if(!document.getElementById('fallstyle')){let s=document.createElement('style');s.id='fallstyle';s.textContent='@keyframes fall{to{transform:translateY(110vh) rotate(600deg);opacity:0}}';document.head.appendChild(s)}}function restart(){score=0;done=[false,false,false,false];mission=0;go('home')}render();
</script></body></html>
